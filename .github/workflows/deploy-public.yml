name: Deploy public branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開前の性能チェック
        run: node scripts/check-performance-budget.mjs

      - name: メンテナンスモード判定・適用
        run: |
          if [ -f .maintenance ]; then
            cp .github/maintenance.html index.html
          fi

      - name: 非公開ファイルを除外
        run: |
          rm -f AGENTS.md CLAUDE.md icon-catalog.html .maintenance
          rm -rf _backup_* .github scripts
          rm -f *.zip
          find . -name ".image-slots.state.json" -delete
          find . -name ".DS_Store" -delete

      - name: publicブランチへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}" --allow-empty
          git push origin HEAD:public --force
