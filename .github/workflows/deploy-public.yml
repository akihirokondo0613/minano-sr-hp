name: Deploy public branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 公開前チェック
        env:
          ASSET_VERSION_BASE_REF: ${{ github.event.before }}
        run: node scripts/preflight.mjs

      - name: メンテナンスモード判定・適用
        run: |
          if [ -f .maintenance ]; then
            find . -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name .github \
              ! -name .maintenance \
              ! -name .htaccess \
              ! -name favicon.ico \
              -exec rm -rf {} +
            cp .github/maintenance.html index.html
            cp .github/maintenance.html 404.html
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
          fi

      - name: 非公開ファイルを除外
        run: |
          rm -f AGENTS.md CLAUDE.md admin-post.html assets-version.json icon-catalog.html mascot.js .maintenance
          rm -f assets/cat-walk-*.webp
          rm -rf _backup_* .github scripts
          rm -f *.zip
          find . -name ".image-slots.state.json" -delete
          find . -name ".DS_Store" -delete

      - name: publicブランチへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}" --allow-empty
          git push origin HEAD:public --force
