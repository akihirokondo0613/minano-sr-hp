name: Deploy public branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 最新mainを確認
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "新しいmain $current があるため、古い $GITHUB_SHA の公開を省略します"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.publish == 'true'
        with:
          node-version: 22

      - name: 公開前チェック
        if: steps.freshness.outputs.publish == 'true'
        env:
          ASSET_VERSION_BASE_REF: ${{ github.event.before }}
        run: node scripts/preflight.mjs

      - name: IndexNow通知を準備
        if: steps.freshness.outputs.publish == 'true'
        id: indexnow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/public:refs/remotes/origin/public
          public_commit="$(git rev-parse origin/public)"

          read_public_file() {
            git show "origin/public:$1" 2>/dev/null | tr -d '\r\n' || true
          }

          base="$(read_public_file indexnow-version.txt)"
          if [ -z "$base" ]; then
            base="$(read_public_file deploy-version.txt)"
          fi
          if [ -z "$base" ]; then
            subject="$(git log -1 --format=%s origin/public)"
            if [[ "$subject" =~ ^Deploy[[:space:]]([0-9a-f]{40})$ ]]; then
              base="${BASH_REMATCH[1]}"
            fi
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "前回IndexNow通知済みのmain SHAを取得できません: ${base:-（空）}" >&2
            exit 1
          fi

          git rev-parse --verify "$base^{commit}" >/dev/null
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"

          previous_mode="$(read_public_file deploy-mode.txt)"
          if [ -z "$previous_mode" ]; then
            if git show origin/public:robots.txt 2>/dev/null | grep -qx 'Disallow: /'; then
              previous_mode="maintenance"
            else
              previous_mode="normal"
            fi
          fi
          if [[ "$previous_mode" != "normal" && "$previous_mode" != "maintenance" ]]; then
            echo "publicの公開モードが不正です: $previous_mode" >&2
            exit 1
          fi

          previous_send_all="$(read_public_file indexnow-send-all.txt)"
          if [[ -n "$previous_send_all" && "$previous_send_all" != "pending" ]]; then
            echo "IndexNow全件通知の待機状態が不正です: $previous_send_all" >&2
            exit 1
          fi

          if [ -f .maintenance ]; then
            mode="maintenance"
            enabled="false"
            send_all="false"
            pending_all="true"
          else
            mode="normal"
            enabled="true"
            if [ "$previous_mode" = "maintenance" ] || [ "$previous_send_all" = "pending" ]; then
              send_all="true"
            else
              send_all="false"
            fi
            if [ "$send_all" = "true" ] || [ "$base" != "$GITHUB_SHA" ]; then
              pending_all="true"
            else
              pending_all="false"
            fi

            temp_dir="$RUNNER_TEMP/minano-indexnow"
            mkdir -p "$temp_dir/scripts/lib"
            cp scripts/submit-indexnow.mjs "$temp_dir/scripts/submit-indexnow.mjs"
            cp scripts/lib/indexnow-changes.mjs "$temp_dir/scripts/lib/indexnow-changes.mjs"
            if [ "$send_all" = "true" ]; then
              INDEXNOW_ROOT="$GITHUB_WORKSPACE" \
                node "$temp_dir/scripts/submit-indexnow.mjs" --check --all
            else
              INDEXNOW_ROOT="$GITHUB_WORKSPACE" \
                node "$temp_dir/scripts/submit-indexnow.mjs" \
                  --check --changed-from "$base" --changed-to "$GITHUB_SHA"
            fi
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "public_commit=$public_commit" >> "$GITHUB_OUTPUT"
          echo "pending_all=$pending_all" >> "$GITHUB_OUTPUT"
          echo "send_all=$send_all" >> "$GITHUB_OUTPUT"

      - name: 公開直前のmainを確認
        if: steps.freshness.outputs.publish == 'true'
        id: publish_gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "新しいmainがあるため、この実行の公開を省略します"
          fi

      - name: メンテナンスモード判定・適用
        if: steps.publish_gate.outputs.publish == 'true'
        run: |
          if [ -f .maintenance ]; then
            find . -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name .github \
              ! -name .maintenance \
              ! -name .htaccess \
              ! -name favicon.ico \
              -exec rm -rf {} +
            cp .github/maintenance.html index.html
            cp .github/maintenance.html 404.html
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
          fi

      - name: 非公開ファイルを除外
        if: steps.publish_gate.outputs.publish == 'true'
        run: |
          rm -f AGENTS.md CLAUDE.md admin-post.html assets-version.json icon-catalog.html .maintenance
          rm -rf _backup_* docs .github scripts
          rm -f *.zip
          find . -name ".image-slots.state.json" -delete
          find . -name ".DS_Store" -delete

      - name: publicブランチへ反映
        if: steps.publish_gate.outputs.publish == 'true'
        id: public
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "新しいmainがあるため、public更新を省略します"
            exit 0
          fi
          printf '%s\n' "$GITHUB_SHA" > deploy-version.txt
          printf '%s\n' "${{ steps.indexnow.outputs.mode }}" > deploy-mode.txt
          printf '%s\n' "${{ steps.indexnow.outputs.base }}" > indexnow-version.txt
          if [ "${{ steps.indexnow.outputs.pending_all }}" = "true" ]; then
            printf 'pending\n' > indexnow-send-all.txt
          else
            rm -f indexnow-send-all.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}" --allow-empty
          public_commit="$(git rev-parse HEAD)"
          git push origin HEAD:public \
            --force-with-lease="refs/heads/public:${{ steps.indexnow.outputs.public_commit }}"
          echo "commit=$public_commit" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: 本番反映を確認
        if: steps.public.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            live_sha="$(curl -fsS --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://minano-sr.com/deploy-version.txt?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              echo "本番反映を確認しました: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "本番のdeploy-version.txtが今回のSHAへ更新されませんでした" >&2
          exit 1

      - name: 変更URLをIndexNowへ通知
        if: steps.public.outputs.published == 'true' && steps.indexnow.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.indexnow.outputs.send_all }}" = "true" ]; then
            INDEXNOW_ROOT="$GITHUB_WORKSPACE" \
              node "$RUNNER_TEMP/minano-indexnow/scripts/submit-indexnow.mjs" --submit --all
          else
            INDEXNOW_ROOT="$GITHUB_WORKSPACE" \
              node "$RUNNER_TEMP/minano-indexnow/scripts/submit-indexnow.mjs" \
                --submit \
                --changed-from "${{ steps.indexnow.outputs.base }}" \
                --changed-to "$GITHUB_SHA"
          fi

          printf '%s\n' "$GITHUB_SHA" > indexnow-version.txt
          if [ "${{ steps.indexnow.outputs.enabled }}" = "true" ]; then
            rm -f indexnow-send-all.txt
          fi
          if git diff --quiet -- indexnow-version.txt indexnow-send-all.txt; then
            echo "IndexNow通知済みSHAは更新済みです"
            exit 0
          fi
          git add -A -- indexnow-version.txt
          if [ -e indexnow-send-all.txt ] \
            || git ls-files --error-unmatch indexnow-send-all.txt >/dev/null 2>&1; then
            git add -A -- indexnow-send-all.txt
          fi
          git commit -m "Record IndexNow $GITHUB_SHA"
          git push origin HEAD:public \
            --force-with-lease="refs/heads/public:${{ steps.public.outputs.commit }}"
