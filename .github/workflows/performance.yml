name: Performance checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 公開データの整合性チェック
        run: |
          node scripts/sync-blog-dates.mjs --check
          node scripts/sync-structured-data.mjs --check
          node scripts/remove-cat-ui.mjs --check
          node scripts/check-structured-data.mjs
          # lastmod はコミット日由来でsquash mergeのたびに変わるため --check では判定しない。
          # ここでは生成器が通ること（URL集合が作れること）だけを確認し、公開用の
          # sitemap は deploy-public.yml が作り直す。
          node gen-sitemap.js

      - name: 静的な性能チェック
        run: node scripts/check-performance-budget.mjs

      - name: 日本語フォントを準備
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK JP'

      - name: ローカル公開サーバーを起動
        run: |
          python3 -m http.server 8765 >/tmp/minano-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null

      - name: Lighthouseをウォームアップ
        run: |
          npx --yes lighthouse@13.0.1 http://127.0.0.1:8765/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse-warmup.json \
            --only-categories=performance

      - name: Lighthouse（モバイル）
        run: |
          for attempt in 1 2 3; do
            npx --yes lighthouse@13.0.1 http://127.0.0.1:8765/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="/tmp/lighthouse-mobile-${attempt}.json" \
              --only-categories=performance
          done

      - name: Lighthouse（PC）をウォームアップ
        run: |
          npx --yes lighthouse@13.0.1 http://127.0.0.1:8765/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse-warmup-desktop.json \
            --only-categories=performance \
            --preset=desktop

      - name: Lighthouse（PC）
        run: |
          for attempt in 1 2 3; do
            npx --yes lighthouse@13.0.1 http://127.0.0.1:8765/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="/tmp/lighthouse-desktop-${attempt}.json" \
              --only-categories=performance \
              --preset=desktop
          done

      - name: 性能基準を判定
        run: |
          node scripts/assert-lighthouse-budget.mjs ci-mobile /tmp/lighthouse-mobile-*.json
          node scripts/assert-lighthouse-budget.mjs ci-desktop /tmp/lighthouse-desktop-*.json

      - name: 計測結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: /tmp/lighthouse-*.json
          retention-days: 14
