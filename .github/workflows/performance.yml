name: Performance checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-layout:
    name: Hero layout (Chromium + WebKit)
    runs-on: ubuntu-latest
    # ブラウザと依存を同梱したPlaywright公式イメージで動かす。
    # 以前は playwright install --with-deps が Ubuntu パッケージを179個取りに行っており、
    # ミラーが遅い日に20分でも30分でも足りずキャンセルされた（2026-08-18に計3回）。
    # イメージに入っているものを使えばこの取得自体が不要になる。
    # イメージのタグは playwright のバージョンと必ず合わせること。ずれるとブラウザが見つからない。
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitの所有者チェックを通す
        # コンテナ内はrootで、チェックアウト先の所有者と一致しないためgitが拒否する。
        # 拒否されると run-layout-checks.cjs が比較baseを解決できず、変更記事だけの検証から
        # 全43記事へfallbackする。実行時間が7分増え、スクリーンショットでディスクを使い切って
        # 検証サーバーが落ちる（2026-08-18のrun 32091442251はこれで、検査自体は全項目合格していた）。
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Playwrightを準備
        # ブラウザはイメージの /ms-playwright にあるので、ダウンロードを抑止する。
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1 pngjs@7.0.0
          node -e "const{chromium,webkit}=require('playwright');console.log('chromium:',chromium.executablePath());console.log('webkit:',webkit.executablePath())"

      - name: 日本語フォントを準備
        # コンテナ内はrootなのでsudoは使わない。取得するのは1パッケージのみ。
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK JP'

      - name: 文節改行と横はみ出しの回帰テスト
        run: node scripts/run-layout-checks.cjs --report-dir "$RUNNER_TEMP/layout-results"

      - name: レイアウト検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-validation-reports
          path: ${{ runner.temp }}/layout-results
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    # ブラウザと依存を同梱したPlaywright公式イメージで動かす（hero-layoutと同じ）。
    # 素のランナーで apt-get install fonts-noto-cjk を実行すると、ミラーが遅い日に892秒stallして
    # 15分の上限に達した（2026-08-18 run 32092196518）。同じパッケージがコンテナ内では10秒で入る。
    # イメージのタグは playwright のバージョンと必ず合わせること。
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitの所有者チェックを通す
        # コンテナ内はrootで、チェックアウト先の所有者と一致しないためgitが拒否する。
        # preflight.mjs の check-asset-version が git を使うので必要。
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lighthouseを準備
        # ブラウザはイメージの /ms-playwright にあるので、npm install時の再取得を抑止する。
        # Lighthouse（chrome-launcher）は CHROME_PATH 環境変数を見るので、同梱Chromiumのパスを渡す。
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          node -v
          npm install --no-save --no-package-lock lighthouse@13.0.1 playwright@1.61.1
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_PATH"

      - name: 公開前チェック
        run: node scripts/preflight.mjs

      - name: 日本語フォントとpython3を準備
        # コンテナ内はrootなのでsudoは使わない。python3は http.server 用（イメージに入っていない場合がある）。
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends fonts-noto-cjk python3
          fc-cache -f
          fc-match 'Noto Sans CJK JP'
          python3 --version

      - name: ローカル公開サーバーを起動
        run: |
          python3 -m http.server 8765 >/tmp/minano-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null

      - name: Lighthouseをウォームアップ
        run: |
          npx lighthouse http://127.0.0.1:8765/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse-warmup.json \
            --only-categories=performance

      - name: Lighthouse（モバイル）
        run: |
          for attempt in 1 2 3; do
            npx lighthouse http://127.0.0.1:8765/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="/tmp/lighthouse-mobile-${attempt}.json" \
              --only-categories=performance
          done

      - name: Lighthouse（PC）をウォームアップ
        run: |
          npx lighthouse http://127.0.0.1:8765/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse-warmup-desktop.json \
            --only-categories=performance \
            --preset=desktop

      - name: Lighthouse（PC）
        run: |
          for attempt in 1 2 3; do
            npx lighthouse http://127.0.0.1:8765/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="/tmp/lighthouse-desktop-${attempt}.json" \
              --only-categories=performance \
              --preset=desktop
          done

      - name: 性能基準を判定
        run: |
          node scripts/assert-lighthouse-budget.mjs ci-mobile /tmp/lighthouse-mobile-*.json
          node scripts/assert-lighthouse-budget.mjs ci-desktop /tmp/lighthouse-desktop-*.json

      - name: 計測結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: /tmp/lighthouse-*.json
          retention-days: 14
