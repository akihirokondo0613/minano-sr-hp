<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ページを開いています｜みなの社会保険労務士事務所</title>
<style>
body{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;margin:0;padding:14vh 24px;color:#1a1a1a;background:#fbfaf8}
.box{max-width:520px;margin:0 auto;background:#fff;border:1px solid #e4e1dc;border-radius:8px;padding:28px}
h1{font-size:17px;margin:0 0 12px}p{font-size:14px;line-height:1.9;color:#555;margin:0 0 12px}
a{color:#123F30}
</style>
</head>
<body>
<div class="box">
  <h1>ページを開いています</h1>
  <p id="msg">数秒たっても<wbr>切り<wbr>替わらない<wbr>ときは、<wbr><a id="go" href="../spot.html">こちらを押してください</a>。</p>
</div>
<script>
(function(){
  // メールに載せた入口。受注システム（Apps Script）は画面を持たないので、ここで HP 側のページへ振り分ける。
  //   a=st / up / ack … 案件ページ（case.html）。up は「送るもの」の位置、ack は「受領確認」の位置
  //   それ以外        … 旧いメールのリンク。案件ページに id と t があれば案件ページ、無ければスポット注文ページへ
  var p=new URLSearchParams(location.search||'');
  var a=p.get('a')||'',id=p.get('id')||'',t=p.get('t')||'';
  var link=document.getElementById('go');
  if(!/^[a-z]{1,12}$/.test(a)||!id||!t){
    document.getElementById('msg').innerHTML='リンクが正しくありません。メールのリンクをもう一度押すか、<a href="../spot.html">スポット注文ページ</a>からお進みください。';
    return;
  }
  var to='case.html?id='+encodeURIComponent(id)+'&t='+encodeURIComponent(t)+(a==='up'?'#docs':a==='ack'?'#ack':'');
  link.href=to;
  location.replace(to);
})();
</script>
</body>
</html>
