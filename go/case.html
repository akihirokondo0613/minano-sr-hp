<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>お手続きの進み具合｜みなの社会保険労務士事務所</title>
<style>
:root{--g:#123F30;--g2:#1E6647;--ink:#1A1D1A;--ink2:#4C524B;--ink3:#7C837A;--line:#E2E2DA;--paper:#fff;--bg:#F4F4F0;--ok:#1E6647;--ng:#8F3D1E;--warn:#8A6D1F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.8;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:20px;margin:0 0 6px;line-height:1.5}
h2.sec{font-size:17px;margin:28px 0 10px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink)}
.sub{color:var(--ink2);font-size:14px;margin:0 0 20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--g)}
.meta{background:var(--g);color:#fff;border-radius:10px;padding:16px;margin-bottom:12px}
.meta .co{font-size:17px;font-weight:700}
.meta .no{font-size:13px;opacity:.85;margin-top:2px}
.stage{display:inline-block;background:#fff;color:var(--g);font-weight:700;border-radius:999px;padding:4px 14px;margin-top:10px;font-size:14px}
.stage.alert{background:#FBEDE7;color:var(--ng)}
.next{background:var(--paper);border:2px solid var(--g);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:15.5px;font-weight:700;line-height:1.7}
.next .m{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:4px}
[hidden]{display:none!important}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:8px;background:var(--g);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;margin-top:12px}
.btn:active{background:var(--g2)}
.btn[disabled]{background:#B9BEB8;cursor:default}
.btn.sub2{background:#fff;color:var(--g);border:1.5px solid var(--g);margin-top:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{border-bottom:1px solid #F0F0EA;padding:9px 4px;vertical-align:top;text-align:left}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl th{font-weight:700;color:var(--ink2);font-size:13px}
.small{font-size:12.5px;color:var(--ink3)}
.sum{background:var(--paper);border:2px solid var(--g);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:17px;font-weight:700;line-height:1.7}
.sum .m{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:4px}
.grp{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.grp:first-of-type{margin-top:0}
.row{border-bottom:1px solid #F0F0EA;padding:11px 0;transition:opacity .2s}
.row:last-child{border-bottom:none}
/* 済んだ行は1行に畳んで、残っている行を目立たせる。押し直せるように「選び直す」だけ出す */
.row.done{opacity:.68;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 0}
.row.done .dn{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:400;line-height:1.5}
.row.done .dn .ph,.row.done .dn .why{display:none}
.row.done .cond,.row.done .prev,.row.done .det{display:none}
.row.done .rb{margin-top:0;flex:0 0 auto;gap:6px}
.rb .redo{display:none}
.row.done .rb .mini{display:none}
.row.done .rb .redo{display:inline-block;padding:5px 9px;min-height:0;font-size:12.5px}
.row.done.editing{opacity:1;display:block;padding:11px 0}
.row.done.editing .dn{font-size:15px;font-weight:700}
.row.done.editing .dn .ph,.row.done.editing .dn .why{display:inline}
.row.done.editing .rb{margin-top:8px;gap:8px}
.row.done.editing .rb .mini{display:inline-block;padding:8px 12px;min-height:38px;font-size:13.5px}
.row.done.editing .rb .redo{display:none}
.row.done.editing .cond,.row.done.editing .prev{display:block}
.row .dn{font-size:15px;line-height:1.6;font-weight:700}
.ph{font-size:11px;font-weight:400;color:var(--g);border:1px solid #BFD9C8;background:#EAF3ED;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.ph.in{background:#FBF5E4;border-color:#E6D9A8;color:var(--warn)}
.ph.sub{background:#F2F2EE;border-color:#DDDDD5;color:var(--ink2)}
.ph.org{background:#FBEDE7;border-color:#E8C6B5;color:var(--ng)}
.why{background:none;border:none;color:var(--ink3);font-size:13px;cursor:pointer;font-family:inherit;padding:0 4px;margin-left:2px}
.cond{font-size:12.5px;color:var(--ink3)}
.det{display:none;font-size:13px;color:var(--ink2);background:#F7F7F3;border-radius:8px;padding:10px 12px;margin-top:7px;line-height:1.75}
.row.open .det{display:block}
.prev{font-size:13px;color:var(--ok);background:#EAF3ED;border-radius:8px;padding:8px 12px;margin-top:7px;line-height:1.7}
.rb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.mini{border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:6px;padding:8px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;min-height:38px}
.mini.go{border-color:var(--g);color:var(--g);font-weight:700}
.mini:active{background:#F0F0EA}
.stt{margin-left:auto;font-size:12.5px;border-radius:4px;padding:3px 9px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.stt.ok{background:#EAF3ED;border-color:#BFD9C8;color:var(--ok)}
.stt.na{background:#F2F2EE}
.stt.later{background:#FBF5E4;border-color:#E6D9A8;color:var(--warn)}
.stt.todo{background:#FBEDE7;border-color:#E8C6B5;color:var(--ng)}
.stt.busy{background:#F7F7F3;color:var(--ink3)}
.stt.busy::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid #ccc;border-top-color:var(--g);border-radius:50%;margin-right:6px;vertical-align:-1px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rerr{font-size:12.5px;color:var(--ng);margin-top:6px}
.inpbox,.mailbox{background:#F7F7F3;border-radius:8px;padding:10px 12px;margin-top:8px}
.mailbox{font-size:13.5px;line-height:1.8}
.inl{display:block;font-size:13px;margin:6px 0}
.inl span{display:block;color:var(--ink2);margin-bottom:2px}
input[type=text],input[type=date],input[type=number],textarea{font-family:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
.inl input{width:100%}
textarea{width:100%;min-height:90px;line-height:1.8;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--g2)}
.rest{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;background:#FAFAF7}
.drop.hot{border-color:var(--g2);background:#F0F6F2}
.drop p{margin:0 0 14px;font-size:14px;color:var(--ink2)}
input[type=file]{display:none}
ul.files{list-style:none;padding:0;margin:14px 0 0}
ul.files li{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #F0F0EA;font-size:13.5px;word-break:break-all}
ul.files li:last-child{border-bottom:none}
.st{flex-shrink:0;width:20px;text-align:center;font-size:15px}
.st.wait{color:var(--ink3)}.st.ok{color:var(--ok)}.st.ng{color:var(--ng)}
.err{color:var(--ng);font-size:12.5px;display:block;margin-top:2px}
.q{border-bottom:1px solid #F0F0EA;padding:13px 0}
.optq{margin-top:6px}.optq summary{cursor:pointer;font-size:13.5px;color:var(--g);padding:10px 0;list-style:none;display:flex;align-items:center;gap:6px}.optq summary::-webkit-details-marker{display:none}.optq summary::before{content:'';width:7px;height:7px;border-right:1.5px solid var(--g);border-bottom:1.5px solid var(--g);transform:rotate(-45deg);transition:transform .15s}.optq[open] summary::before{transform:rotate(45deg)}
.q:last-child{border-bottom:none}
.q.hide{display:none}
.q.bad{background:#FDF3EE;border-radius:8px;padding:13px 10px;border-bottom-color:#E8C6B5}
.q .ql{font-size:15px;font-weight:700;line-height:1.6}
.q .rq{font-size:11px;font-weight:400;color:var(--ng);border:1px solid #E8C6B5;background:#FBEDE7;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.q .qh{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.7}
.q .ops{margin-top:8px}
label.op{display:flex;gap:9px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
label.op input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--g)}
.q .num{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px}
.q .saved{font-size:12px;color:var(--ok);margin-left:8px}
.q .saved.busy{color:var(--ink3)}
.q.pairL,.q.pairR{display:inline-flex;flex-direction:column;vertical-align:top;width:calc(50% - 5px);border-bottom:none;padding-bottom:4px}
.q.pairL .qh{order:3;margin-top:6px}
.q.pairR{margin-left:8px}
.q.pairL input,.q.pairR input{width:100%;margin-top:8px}
@media(max-width:480px){.q.pairL,.q.pairR{display:block;width:100%;margin-left:0}.q.pairL{padding-bottom:0}}
.mn{border:1.5px solid #E6D9A8;background:#FDFBF0;border-radius:10px;padding:16px;margin-bottom:14px}
.mn h2{color:#7A6414}
/* 送信完了の枠。書類の完了行（.row.done）に当たらないよう .card に限定する */
.card.done{text-align:center;padding:30px 20px}
.card.done .mk{font-size:44px;color:var(--ok);line-height:1}
.card.done h2{font-size:19px;margin:14px 0 8px;color:var(--ink)}
.card.done p{font-size:14px;color:var(--ink2);margin:0 0 12px}
.foot{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:24px;line-height:1.9}
.bar{height:4px;background:#E8E8E2;border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--g2);width:0;transition:width .25s}
.load{text-align:center;padding:60px 20px;color:var(--ink2);font-size:14px}
.load .sp{display:inline-block;width:18px;height:18px;border:2px solid #ccc;border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1A1D1A;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
.toast.on{opacity:.95}
.ackbox{background:#EAF3ED;border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ok)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.stt.busy::before,.load .sp{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="load" id="loading"><span class="sp"></span>ご注文の内容を読み込んでいます…</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  // 受注システム（Apps Script）の入口。/a/macros/minano-sr.com/ 形式にする理由は go/index.html と同じ。
  var ENDPOINT='https://script.google.com/a/macros/minano-sr.com/s/AKfycbyMbrQKhAhE0B_gyDHL6yhowdB1ulDl2QYtc-5jYR40iPtRjVs6GjC_i6sMDzF-7hc/exec';
  var qs=new URLSearchParams(location.search);
  var ORDER=(qs.get('id')||'').toUpperCase(), TOKEN=qs.get('t')||'';
  var app=document.getElementById('app');
  var C=null, D=null, AN={}, Q=[], busy=false, sent=0, QS=[];

  // 説明文の中の URL（当事務所の様式など）だけリンクにする。ほかは文字のまま
  function linkify(t){return esc(t).replace(/https:\/\/minano-sr\.com\/[^\s）)]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'})}
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function yen(n){return Number(n||0).toLocaleString('ja-JP')+' 円'}
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast on';clearTimeout(t._h);t._h=setTimeout(function(){t.className='toast'},2600)}
  function api(p){
    p.orderNo=ORDER;p.token=TOKEN;
    return fetch(ENDPOINT,{method:'POST',mode:'cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(function(r){return r.json()});
  }
  function fail(msg){
    app.innerHTML='<div class="card"><h2>開けませんでした</h2><p class="rest">'+esc(msg)+'</p><p class="rest">お急ぎのときは <a href="tel:0764602562">076-460-2562</a>（平日9:00〜18:00）へ。書類はメールに添付いただいても受け取れます。</p></div>';
  }
  if(!ORDER||!/^[0-9a-f]{32}$/.test(TOKEN)){fail('リンクが不完全です。メールのリンクをもう一度お開きください。');return}

  fetch(ENDPOINT+'?a=case&id='+encodeURIComponent(ORDER)+'&t='+encodeURIComponent(TOKEN),{redirect:'follow'})
    .then(function(r){return r.json()})
    .then(function(c){ if(!c||!c.ok){fail((c&&c.error)||'読み込めませんでした。');return} C=c;D=c.docs;render(); })
    .catch(function(){fail('通信に失敗しました。電波の良い場所でページを開き直してください。')});

  /* ---------- 描画 ---------- */
  function stateClass(s){ if(s==='出した'||s==='入力済'||s==='前回分'||s==='郵送')return 'ok'; if(s==='該当なし')return 'na'; if(s==='後日提出')return 'later'; return 'todo'; }
  function stateText(x){ if(x.state==='前回分')return '前回分を使用'; if(x.state==='郵送')return '郵送予定'; return x.state+(x.date?' '+x.date:''); }
  function rowHtml(g,x){
    var info=x.kind==='info', orig=!x.photo, prev=x.state==='前回分', fl=x.fields?x.fields.split('|'):[], xl=/Excel|\.xlsx/.test(x.doc);
    var h='<div class="row'+(stateClass(x.state)!=='todo'?' done':'')+'" data-mid="'+esc(g.matterId)+'" data-doc="'+esc(x.doc)+'" data-kind="'+esc(x.kind)+'">';
    h+='<div class="dn">'+esc(x.short)+(xl?'<span class="ph in">Excel</span>':info?'<span class="ph in">入力でも可</span>':'<span class="ph sub">提出書類</span>')+(xl?'':orig?'<span class="ph org">原本を郵送</span>':'<span class="ph">写真OK</span>')+'<button type="button" class="why" aria-label="説明を開く">？</button></div>';
    if(x.cond)h+='<div class="cond">条件　'+esc(x.cond)+'</div>';
    h+='<div class="det">'+linkify(x.detail)+(info?'<br>この資料は行政に出すものではなく、内容を確認するためのものです。お手元に無ければ「入力する」で項目を書いていただくか、同じことが分かる別の資料を送ってください。':'')+(orig?'<br>原本が必要な書類です。写真では代えられないので、下の宛先へ郵送してください。':'')+'</div>';
    if(prev)h+='<div class="prev">前回いただいた分を使います'+(x.date?'（'+esc(x.date)+'）':'')+'。変わっていれば送り直してください。</div>';
    h+='<div class="rb">';
    if(orig)h+='<button type="button" class="mini go post">郵送します</button>';
    else h+='<button type="button" class="mini go pick">'+(xl?'記入したExcelを送る':prev?'変更あり（送り直す）':(info?'書類か代わりの資料を送る':'写真かPDFを送る'))+'</button>';
    if(info)h+='<button type="button" class="mini go inp">入力する</button>';
    h+='<button type="button" class="mini na">該当なし</button><button type="button" class="mini later">後日提出</button><button type="button" class="mini redo">選び直す</button><input type="date" class="dt" hidden aria-label="提出できる日">';
    h+='<span class="stt '+stateClass(x.state)+'">'+esc(stateText(x))+'</span></div><div class="rerr" hidden></div>';
    if(orig)h+='<div class="mailbox" hidden><b>郵送先</b><br>'+esc(C.address)+'<br>封筒に「'+esc(C.orderNo)+'」とお書きください。</div>';
    if(info){
      h+='<div class="inpbox" hidden>';
      if(fl.length){fl.forEach(function(f){h+='<label class="inl"><span>'+esc(f)+'</span><input type="text" class="inf" data-f="'+esc(f)+'"></label>'})}
      else{h+='<textarea class="inf" data-f="内容" placeholder="分かることを書いてください"></textarea>'}
      h+='<div class="rb"><button type="button" class="mini go inpsave">保存する</button><button type="button" class="mini inpclose">閉じる</button></div>';
      if(x.content)h+='<div class="cond">入力済み：'+esc(x.content)+'</div>';
      h+='</div>';
    }
    h+=(xl?'<input type="file" class="rf" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">':'<input type="file" class="rf" multiple accept="image/*,application/pdf" capture="environment">')+'</div>';
    return h;
  }
  function groupsHtml(groups){var h='';groups.forEach(function(g){h+='<div class="grp">'+esc(g.name)+'</div>';g.list.forEach(function(x){h+=rowHtml(g,x)})});return h}
  function qHtml(g,q){
    var h='<div class="q'+(q.pair?' pair'+q.pair:'')+'" data-qid="'+esc(q.id)+'" data-type="'+esc(q.type)+'" data-req="'+q.required+'" data-mid="'+esc(g.matterId)+'" data-sid="'+esc(q.sid)+'" data-sin="'+esc(q.sin)+'">';
    h+='<div class="ql">'+esc(q.q)+(q.required?'<span class="rq">必須</span>':'')+'<span class="saved"></span></div>';
    if(q.help)h+='<div class="qh">'+esc(q.help)+'</div>';
    if(q.type==='choice'||q.type==='multi'){h+='<div class="ops">';var parts=(q.value||'').split('、');(q.options||[]).forEach(function(o){h+='<label class="op"><input type="'+(q.type==='choice'?'radio':'checkbox')+'" name="'+esc(q.id)+'" class="qv" value="'+esc(o)+'"'+(parts.indexOf(o)>=0?' checked':'')+'><span>'+esc(o)+'</span></label>'});h+='</div>'}
    if(q.type==='date')h+='<div class="num"><input type="date" class="qv" name="'+esc(q.id)+'" value="'+esc(q.value)+'"></div>';
    if(q.type==='number')h+='<div class="num"><input type="number" class="qv" name="'+esc(q.id)+'" inputmode="numeric" step="1" value="'+esc(q.value)+'" style="width:9em"><span>'+esc(q.unit)+'</span></div>';
    if(q.type==='name')h+='<input type="text" class="qv" name="'+esc(q.id)+'" value="'+esc(q.value)+'" autocomplete="off" style="width:100%">';
    if(q.type==='text')h+='<textarea class="qv" name="'+esc(q.id)+'" style="min-height:70px">'+esc(q.value)+'</textarea>';
    return h+'</div>';
  }
  function docsHtml(){
    if(!D||!D.ok)return '';
    var h='<h2 class="sec" id="docs">お送りいただくもの・お答えいただくこと</h2>';
    h+='<div class="sum">送るもの <span id="cRest">'+D.rest+'</span>点 ／ 答えること <span id="cMiss">'+D.missing+'</span>問 ／ 目安 <span id="cMin">3</span>分<span class="m">書類はスマホの写真で構いません。新しく作っていただくものはありません。'+(D.due?'提出期限 '+esc(D.due)+'。':'')+'途中でやめて、あとから同じリンクで続けられます。</span></div>';
    h+='<p class="sub">「提出書類」は行政に出すもので、写真かPDFを送ってください。「入力でも可」のものは、書類の代わりに項目を入力するか、同じことが分かる別の資料でも結構です。御社に無いものは「該当なし」を押してください。押したその場で記録されます。</p>';
    if(D.always.length)h+='<div class="card"><h2>送るもの</h2>'+groupsHtml(D.always)+'</div>';
    if(D.cond.length){
      // 条件付きの書類は手続きによっては10点を超える。1点ずつ押させると、それだけで手が止まる。
      // ほとんどの会社はほとんどの条件に当てはまらないので、まとめて片付けられるようにする。
      var ctodo=D.cond.reduce(function(a,g){return a+g.list.filter(function(x){return x.state==='未'}).length},0);
      h+='<div class="card condcard"><h2>該当する場合だけ</h2><p class="rest">当てはまるものだけお送りください。'+(ctodo>1?'当てはまらないものは、下のボタンでまとめて片付けられます。あとから個別に選び直せます。':'当てはまらないときは「該当なし」を押してください。それで完了です。')+'</p>';
      if(ctodo>1)h+='<button type="button" class="btn sub2" id="naall" style="margin:0 0 12px">'+ctodo+'点すべて「該当なし」にする</button>';
      h+=groupsHtml(D.cond)+'</div>';
    }
    h+='<div class="card"><h2>その他のファイルを送る</h2><div class="drop" id="drop"><p>上の一覧に無いものは、ここから送ってください。<br>1つ '+D.maxMB+'MB まで・何枚でも</p><button class="btn" type="button" id="pick" style="margin-top:0">写真・ファイルを選ぶ</button><input type="file" id="f" multiple accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic"></div><div class="bar" id="bar" style="display:none"><i></i></div><ul class="files" id="list"></ul></div>';
    h+='<div class="card mn"><h2>マイナンバーが載っている書類</h2><p class="rest">雇用保険の一部の届出では個人番号の記載が必要です。その書類はこちらから送ってください。分けて保管し、手続きが終わったら消します。</p><button class="btn sub2" type="button" id="pickmn">マイナンバーの書類を選ぶ</button><input type="file" id="fmn" multiple accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic"></div>';
    if(D.qgroups.length){h+='<h2 class="sec" style="border:none;padding-top:6px">お答えいただくこと</h2><p class="sub">選ぶだけです。押したその場で記録されます。分からないものは飛ばして、あとから同じリンクで続けられます。</p>';
      D.qgroups.forEach(function(g){
        // 必須（と、答えによって出る追加の質問）は開いたまま。任意の質問は折りたたんで、答えの数を少なく見せる
        var main=[],opt=[];g.defs.forEach(function(q){(q.required||q.sid||q.value)?main.push(q):opt.push(q)});
        h+='<div class="card"><h2>'+esc(g.name)+'</h2>'+main.map(function(q){return qHtml(g,q)}).join('');
        if(opt.length)h+='<details class="optq"><summary>あれば助かること（任意・'+opt.length+'問）</summary>'+opt.map(function(q){return qHtml(g,q)}).join('')+'</details>';
        h+='</div>'})}
    if(D.fallback&&D.fallback.length){h+='<div class="card"><h2>そのほかにお答えいただきたいこと</h2><p class="rest">この項目だけは、下の「その他・補足」に書いてお答えください。</p>';D.fallback.forEach(function(f){h+='<div class="grp">'+esc(f.name)+'</div>';f.list.forEach(function(t){h+='<div class="qh" style="font-size:13.5px">・'+esc(t)+'</div>'})});h+='</div>'}
    h+='<div class="card"><h2>その他・補足</h2><p class="rest">書くことが無ければ空欄のままで構いません。</p><textarea id="ans" placeholder="お伝えしておきたいことがあれば、ここに書いてください。">'+esc(D.freeText)+'</textarea></div>';
    h+='<button class="btn" type="button" id="fin">送信する</button><p class="small" style="text-align:center;margin-top:8px">送るものが残っていても押せます。残りはあとから同じリンクで送れます。</p>';
    return h;
  }
  function render(){
    var h='';
    h+='<div class="meta"><div class="co">'+esc(C.company)+'</div><div class="no">ご注文番号 '+esc(C.orderNo)+(C.orderDate?'　'+esc(C.orderDate)+' 注文':'')+'</div><div><span class="stage'+(C.alert?' alert':'')+'">'+esc(C.stage)+'</span></div></div>';
    h+='<div class="next">次にすること<span class="m">'+esc(C.next)+'</span>';
    if(C.canUpload)h+='<a class="btn" href="#docs">書類を送る・答える</a>';
    if(C.canAck)h+='<a class="btn" href="#ack">公文書を受け取りました（受領確認）</a>';
    h+='</div>';
    if(C.stages.length>1){h+='<div class="card"><table class="tbl">';C.stages.forEach(function(s){h+='<tr><td>'+esc(s.name)+'</td><td class="n">'+esc(s.stage)+'</td></tr>'});h+='</table></div>'}
    h+='<div class="card"><h2>ご注文の内容</h2><table class="tbl">';
    C.items.forEach(function(it){h+='<tr><td>'+esc(it.name)+'　'+esc(it.qty)+esc(it.unit)+(it.target||it.date?'<br><span class="small">'+esc([it.target?'対象 '+it.target:'',it.date].filter(String).join('　'))+'</span>':'')+(it.legalDue?'<br><span class="small">法定期限 '+esc(it.legalDue)+'</span>':'')+'</td><td class="n">'+(it.review?'<span class="small">確認中</span>':esc(yen(it.subtotal)))+'</td></tr>'});
    h+='<tr><th>合計（税抜）</th><th class="n">'+esc(yen(C.subtotal))+'</th></tr></table></div>';
    h+=docsHtml();
    h+='<h2 class="sec" id="deliv">お渡しした公文書</h2>';
    if(!C.delivered)h+='<p class="rest">まだお渡しできる公文書はありません。行政の処理が終わり次第、メールでお送りし、ここにも載せます。</p>';
    else if(C.deliveredFiles.length){h+='<ul>'+C.deliveredFiles.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul><p class="small">同じものを納品のメールに添付してお送りしています。</p>'}
    else h+='<p class="rest">納品のメールに添付してお送りしています。メールをご確認ください。</p>';
    h+='<div id="ack">';
    if(C.acked)h+='<div class="ackbox">受領のご確認をいただいています。ありがとうございました。</div>';
    else if(C.canAck)h+='<div class="card"><h2>受領のご確認</h2><p class="rest">公文書の内容をご確認のうえ、押してください。押すと担当者に伝わります。</p><button class="btn" type="button" id="ackbtn" style="margin-top:0">公文書を受け取りました</button></div>';
    h+='</div>';
    h+='<h2 class="sec">請求と支払</h2><div class="card"><table class="tbl"><tr><th>ご請求額</th><td class="n">'+esc(yen(C.billing))+'</td></tr><tr><th>支払期限</th><td class="n">'+esc(C.payDue||'—')+'</td></tr><tr><th>ご入金</th><td class="n">'+esc(C.paid?C.paid+' に確認しました':'まだ確認できていません')+'</td></tr></table>'+(C.invoiceUrl?'<a class="btn sub2" href="'+esc(C.invoiceUrl)+'" target="_blank" rel="noopener">請求書を開く</a>':'')+'</div>';
    if(C.reorderUrl)h+='<h2 class="sec">次回のご注文</h2><p class="rest">会社情報の入力は要りません。前回いただいた就業規則などの資料は、変更がなければそのまま使います。</p><a class="btn sub2" href="'+esc(C.reorderUrl)+'">次回のご注文はこちら</a>';
    h+='<p class="foot">'+esc(C.office)+'<br>ご不明な点は '+esc(C.tel)+' / '+esc(C.mail)+'（平日9:00〜18:00）<br>このページは同じリンクから何度でも開けます。</p>';
    app.innerHTML=h;
    bind();
    if(location.hash){var tgt=document.querySelector(location.hash);if(tgt)setTimeout(function(){tgt.scrollIntoView({block:'start'})},50)}
  }

  /* ---------- 書類・回答の操作 ---------- */
  function setStt(row,txt,cls){var s=row.querySelector('.stt');s.textContent=txt;s.className='stt '+(cls||'');row.classList.toggle('done',cls==='ok'||cls==='na'||cls==='later');if(cls&&cls!=='busy')row.classList.remove('editing')}
  function rowErr(row,msg){var e=row.querySelector('.rerr');e.textContent=msg||'';e.hidden=!msg}
  function recount(){
    // 残り点数と、残りから出した所要の目安。固定の「3分」だと点数の多い手続きで嘘になる
    var rest=0,sec=0;
    [].slice.call(document.querySelectorAll('.row')).forEach(function(r){
      if(!/todo|busy/.test(r.querySelector('.stt').className))return;
      rest++;
      // 必ず送るもの＝写真を撮って送る。条件付き＝まとめて押せるので1点あたりは軽い
      sec+=r.closest('.condcard')?8:30;
    });
    var el=document.getElementById('cRest');if(el)el.textContent=rest;
    var miss=QS.filter(function(q){return q.dataset.req==='1'&&shown(q)&&!(AN[q.dataset.qid]||'')}).length;
    var em=document.getElementById('cMiss');if(em)em.textContent=miss;
    sec+=miss*15;
    var mn=document.getElementById('cMin');
    if(mn)mn.textContent=rest+miss===0?'0':String(Math.max(1,Math.round(sec/60)));
  }
  function mark(row,state,date,content){
    var before={txt:row.querySelector('.stt').textContent,cls:row.querySelector('.stt').className.replace('stt ','')};
    var cls=stateClass(state);setStt(row,state+(date?' '+date:''),'busy');rowErr(row,'');
    api({act:'mark',matterId:row.dataset.mid,docName:row.dataset.doc,state:state,date:date||'',content:content||''})
      .then(function(res){if(res&&res.ok){setStt(row,(state==='郵送'?'郵送予定':state)+(res.date?' '+res.date:''),cls);recount();toast(state==='該当なし'?'「該当なし」で記録しました':state==='後日提出'?'後日提出で記録しました':state==='郵送'?'郵送予定で記録しました':'入力内容を記録しました')}else{setStt(row,before.txt,before.cls);rowErr(row,(res&&res.error)||'記録できませんでした。もう一度お試しください。')}})
      .catch(function(){setStt(row,before.txt,before.cls);rowErr(row,'通信に失敗しました。もう一度お試しください。')});
  }
  function bulkNa(btn){
    var card=btn.closest('.card');
    var rows=[].slice.call(card.querySelectorAll('.row')).filter(function(r){return /todo/.test(r.querySelector('.stt').className)});
    if(!rows.length){toast('まとめて記録するものはありません');btn.hidden=true;return}
    var before=rows.map(function(r){var s=r.querySelector('.stt');return {r:r,txt:s.textContent,cls:s.className.replace('stt ','')}});
    var orig=btn.textContent;
    btn.disabled=true;btn.textContent='記録しています…';
    rows.forEach(function(r){setStt(r,'該当なし','busy');rowErr(r,'')});
    var undo=function(msg){before.forEach(function(b){setStt(b.r,b.txt,b.cls)});btn.disabled=false;btn.textContent=orig;toast(msg)};
    api({act:'markall',state:'該当なし',docs:rows.map(function(r){return {matterId:r.dataset.mid,docName:r.dataset.doc}})})
      .then(function(res){
        if(res&&res.ok){rows.forEach(function(r){setStt(r,'該当なし','na')});recount();btn.hidden=true;toast(res.count+'点を「該当なし」で記録しました。当てはまるものがあれば選び直せます')}
        else undo((res&&res.error)||'記録できませんでした。');
      })
      .catch(function(){undo('通信に失敗しました。もう一度お試しください。')});
  }
  function val(q){var t=q.dataset.type;if(t==='choice'){var r=q.querySelector('.qv:checked');return r?r.value:''}if(t==='multi'){return [].slice.call(q.querySelectorAll('.qv:checked')).map(function(e){return e.value}).join('、')}var el=q.querySelector('.qv');return el?String(el.value).trim():''}
  function shown(q){var sid=q.dataset.sid;if(!sid)return true;var v=AN[sid]||'';if(!v)return false;var want=(q.dataset.sin||'').split('|');for(var i=0;i<want.length;i++){if(want[i]&&v.indexOf(want[i])>=0)return true}return false}
  function relayout(){QS.forEach(function(q){if(shown(q))q.classList.remove('hide');else{q.classList.remove('bad');q.classList.add('hide')}})}
  function put(q){var v=val(q);AN[q.dataset.qid]=v;if(v)q.classList.remove('bad');relayout();recount();var mk=q.querySelector('.saved');mk.textContent='保存中…';mk.className='saved busy';
    api({act:'answer',qid:q.dataset.qid,matterId:q.dataset.mid||'',value:v}).then(function(res){if(res&&res.ok){mk.textContent='✓ 記録しました';mk.className='saved';setTimeout(function(){mk.textContent=''},1800)}else{mk.textContent='';toast((res&&res.error)||'記録できませんでした。')}}).catch(function(){mk.textContent='';toast('通信に失敗しました。もう一度お試しください。')})}
  function bind(){
    QS=[].slice.call(document.querySelectorAll('.q'));
    QS.forEach(function(q){AN[q.dataset.qid]=val(q);[].slice.call(q.querySelectorAll('.qv')).forEach(function(el){el.addEventListener(el.tagName==='TEXTAREA'?'blur':'change',function(){put(q)})})});
    relayout();
    recount();   // 開いた時点の残りから、点数と所要の目安を出す
    var ansEl=document.getElementById('ans');var K='mn-spot-'+ORDER;
    if(ansEl){try{var sv=JSON.parse(localStorage.getItem(K)||'{}');if(sv.__ans&&!ansEl.value)ansEl.value=sv.__ans}catch(e){}ansEl.addEventListener('input',function(){try{localStorage.setItem(K,JSON.stringify({__ans:this.value}))}catch(e){}})}
    document.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('button'):null;if(!b)return;var row=b.closest('.row');
      if(b.id==='naall'){bulkNa(b);return}
      if(b.classList.contains('redo')&&row){row.classList.add('editing');return}
      if(b.classList.contains('why')&&row){row.classList.toggle('open');return}
      if(b.classList.contains('pick')&&row){row.querySelector('.rf').click();return}
      if(b.classList.contains('post')&&row){row.querySelector('.mailbox').hidden=false;mark(row,'郵送','','');return}
      if(b.classList.contains('inp')&&row){var bx=row.querySelector('.inpbox');bx.hidden=!bx.hidden;if(!bx.hidden){var f0=bx.querySelector('.inf');if(f0)f0.focus()}return}
      if(b.classList.contains('inpclose')&&row){row.querySelector('.inpbox').hidden=true;return}
      if(b.classList.contains('inpsave')&&row){var parts=[];[].slice.call(row.querySelectorAll('.inf')).forEach(function(el){var v=String(el.value).trim();if(v)parts.push((el.dataset.f&&el.dataset.f!=='内容'?el.dataset.f+'：':'')+v)});if(!parts.length){rowErr(row,'内容を入力してください。');return}row.querySelector('.inpbox').hidden=true;mark(row,'入力済','',parts.join('／'));return}
      if(b.classList.contains('na')&&row){mark(row,'該当なし','','');return}
      if(b.classList.contains('later')&&row){var d=row.querySelector('.dt');d.hidden=false;d.focus();if(d.showPicker){try{d.showPicker()}catch(x){}}return}
      if(b.id==='pick'){document.getElementById('f').click();return}
      if(b.id==='pickmn'){document.getElementById('fmn').click();return}
      if(b.id==='fin'){finish();return}
      if(b.id==='ackbtn'){ack(b);return}
    });
    document.addEventListener('change',function(e){var t=e.target;if(!t.classList)return;var row=t.closest?t.closest('.row'):null;
      if(row&&t.classList.contains('dt')&&t.value){mark(row,'後日提出',t.value,'');t.hidden=true;return}
      if(row&&t.classList.contains('rf')){add(t.files,false,row);t.value='';return}
      if(t.id==='f'){add(t.files,false,null);t.value='';return}
      if(t.id==='fmn'){add(t.files,true,null);t.value='';return}});
    var dp=document.getElementById('drop');
    if(dp){['dragenter','dragover'].forEach(function(v){dp.addEventListener(v,function(e){e.preventDefault();dp.classList.add('hot')})});['dragleave','drop'].forEach(function(v){dp.addEventListener(v,function(e){e.preventDefault();dp.classList.remove('hot')})});dp.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files,false,null)})}
  }

  /* ---------- ファイル送信（1つずつ順に） ---------- */
  function fileRow(name){var li=document.createElement('li');li.innerHTML='<span class="st wait">…</span><span class="nm"></span>';li.querySelector('.nm').textContent=name;document.getElementById('list').appendChild(li);return li}
  function prog(){var b=document.getElementById('bar');if(!b)return;if(!Q.length&&!busy){b.style.display='none';return}b.style.display='block';var tot=sent+Q.length+(busy?1:0);b.firstChild.style.width=Math.round(sent/Math.max(tot,1)*100)+'%'}
  function add(files,isMn,rw){Array.prototype.forEach.call(files,function(f){var li=fileRow(f.name+(isMn?'（マイナンバー）':''));if(f.size>D.maxMB*1024*1024){li.querySelector('.st').className='st ng';li.querySelector('.st').textContent='×';var e=document.createElement('span');e.className='err';e.textContent='大きすぎます（'+Math.round(f.size/1048576)+'MB）。写真を撮り直すか、分けて送ってください。';li.appendChild(e);return}if(rw)setStt(rw,'送信中…','busy');Q.push({file:f,li:li,mn:!!isMn,rw:rw||null})});next();prog()}
  function next(){if(busy||!Q.length)return;busy=true;prog();var it=Q.shift();var r=new FileReader();
    r.onerror=function(){ffail(it,'読み取れませんでした');busy=false;prog();next()};
    r.onload=function(){api({act:'file',name:it.file.name,mimeType:it.file.type,dataUrl:r.result,mynumber:it.mn,matterId:it.rw?it.rw.dataset.mid:'',docName:it.rw?it.rw.dataset.doc:''}).then(function(res){if(res&&res.ok){it.li.querySelector('.st').className='st ok';it.li.querySelector('.st').textContent='✓';sent++;if(it.rw){setStt(it.rw,'出した','ok');rowErr(it.rw,'')}toast('送信しました：'+it.file.name);recount()}else{ffail(it,(res&&res.error)||'送れませんでした')}busy=false;prog();next()}).catch(function(){ffail(it,'通信に失敗しました。もう一度お試しください。');busy=false;prog();next()})};
    r.readAsDataURL(it.file)}
  function ffail(it,msg){var s=it.li.querySelector('.st');s.className='st ng';s.textContent='×';var e=document.createElement('span');e.className='err';e.textContent=msg;it.li.appendChild(e);if(it.rw){setStt(it.rw,'未','todo');rowErr(it.rw,msg)}}

  /* ---------- 送信を完了する／受領確認 ---------- */
  function finish(){
    if(busy||Q.length){toast('送信中のファイルがあります。終わるまでお待ちください。');return}
    var bad=QS.filter(function(q){return q.dataset.req==='1'&&shown(q)&&!(AN[q.dataset.qid]||'')});
    QS.forEach(function(q){q.classList.remove('bad')});
    if(bad.length){bad.forEach(function(q){q.classList.add('bad')});bad[0].scrollIntoView({block:'center'});toast('あと'+bad.length+'問、答えていただく必要があります。赤くなっている質問をご覧ください。');return}
    var btn=document.getElementById('fin');btn.disabled=true;btn.textContent='送信しています…';
    api({act:'finish',answers:(document.getElementById('ans')||{}).value||''}).then(function(res){
      if(!(res&&res.ok)){btn.disabled=false;btn.textContent='送信する';toast((res&&res.error)||'送信できませんでした。もう一度お試しください。');return}
      try{localStorage.removeItem('mn-spot-'+ORDER)}catch(e){}
      var box=document.createElement('div');box.className='card done';box.innerHTML='<div class="mk">✓</div><h2>送信しました</h2><p>お送りいただいたファイル '+(res.count||0)+'件。'+(res.allIn?'書類はすべて揃いました。担当者が中身を確認して着手します。':'まだ残っている書類は、同じリンクからあとで送れます。')+'</p><p>担当者が確認し、着手したら「着手のお知らせ」をメールでお送りします。</p>';
      btn.replaceWith(box);box.scrollIntoView({block:'center'});
    }).catch(function(){btn.disabled=false;btn.textContent='送信する';toast('通信に失敗しました。もう一度お試しください。')});
  }
  function ack(btn){
    btn.disabled=true;btn.textContent='記録しています…';
    api({act:'ack'}).then(function(res){
      if(!(res&&res.ok)){btn.disabled=false;btn.textContent='公文書を受け取りました';toast((res&&res.error)||'記録できませんでした。');return}
      document.getElementById('ack').innerHTML='<div class="ackbox">受領のご確認を承りました（'+esc(res.date||'')+'）。ありがとうございました。</div>';toast('受領を記録しました');
    }).catch(function(){btn.disabled=false;btn.textContent='公文書を受け取りました';toast('通信に失敗しました。もう一度お試しください。')});
  }
})();
</script>
